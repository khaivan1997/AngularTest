<div class="drawing-view__toolbar" role="toolbar" aria-label="Drawing options">
  <div class="drawing-view__tools" aria-label="Drawing tools">
    <button
      type="button"
      class="drawing-view__tool-button"
      [class.is-active]="activeTool() === 'select'"
      [attr.aria-pressed]="activeTool() === 'select'"
      (click)="onSelectTool()"
    >
      Select
    </button>
    <button
      type="button"
      class="drawing-view__tool-button"
      [class.is-active]="activeTool() === 'connect'"
      [attr.aria-pressed]="activeTool() === 'connect'"
      (click)="onConnectTool()"
    >
      Connect
    </button>
    <button
      type="button"
      class="drawing-view__tool-button drawing-view__tool-button--delete"
      [disabled]="selectedEntities().size === 0"
      (click)="onDelete()"
    >
      Delete
    </button>
    <button
      type="button"
      class="drawing-view__tool-button drawing-view__tool-button--delete"
      (click)="onClear()"
    >
      Clear
    </button>
  </div>

  <span class="drawing-view__zoom-label">Current zoom: {{ zoomLabel() }}</span>

  <div class="toggle-bar">
    <label class="select-box__label" for="grid-mode">Grid</label>
    <select
      id="grid-mode"
      class="select-box"
      [value]="gridMode()"
      (change)="onGridModeChange($event)"
    >
      <option value="noGrid">No grid</option>
      <option value="minorGrid">Minor grid</option>
      <option value="majorGrid">Major grid</option>
    </select>
  </div>
</div>

<div class="drawing-view__canvas">
  <svg
    #drawingSvg
    class="drawing-view__svg"
    aria-label="Drawing"
    [attr.width]="drawingWidth"
    [attr.height]="drawingHeight"
    [attr.viewBox]="drawingViewBox"
    [style.width.px]="drawingWidth"
    [style.height.px]="drawingHeight"
    [style.cursor]="svgCursor()"
    (dragover)="onDragOver($event)"
    (drop)="onDrop($event)"
    (wheel)="onWheel($event)"
  >
    <g #drawingViewport [attr.transform]="drawingTransform()">
      @if (gridFill(); as fill) {
        <rect
          class="drawing-view__grid"
          [attr.x]="gridX"
          [attr.y]="gridY"
          [attr.width]="gridWidth"
          [attr.height]="gridHeight"
          [attr.fill]="fill"
        ></rect>
      }

      <ng-container #drawingItems></ng-container>
    </g>
  </svg>
</div>
