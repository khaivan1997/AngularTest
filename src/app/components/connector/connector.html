@if (path(); as pathValue) {
  <svg:path class="connector__path" [attr.d]="pathValue"></svg:path>
  @if (isSelected()) {
    <svg:path class="connector__glow" [attr.d]="pathValue"></svg:path>
    @if (fromControlPoint(); as fromControlPoint) {
      <svg:circle
        class="connector__control-point"
        [attr.cx]="fromControlPoint.x"
        [attr.cy]="fromControlPoint.y"
        (pointerdown)="onControlPointPointerDown($event, 'from')"
        (click)="$event.stopPropagation()"
        r="2.4"
      ></svg:circle>
    }
    @if (destinationControlPoint(); as destinationControlPoint) {
      <svg:circle
        class="connector__control-point"
        [attr.cx]="destinationControlPoint.x"
        [attr.cy]="destinationControlPoint.y"
        (pointerdown)="onControlPointPointerDown($event, 'destination')"
        (click)="$event.stopPropagation()"
        r="2.4"
      ></svg:circle>
    }
  }
  <svg:path class="connector__hit" [attr.d]="pathValue"></svg:path>
}
