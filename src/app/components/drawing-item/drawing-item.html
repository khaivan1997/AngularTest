<svg:rect
  class="drawing-item__hit"
  fill="transparent"
  pointer-events="all"
  [attr.x]="bounds()?.x"
  [attr.y]="bounds()?.y"
  [attr.width]="bounds()?.width"
  [attr.height]="bounds()?.height"
></svg:rect>
<svg:use #templateUse [attr.href]="templateHref()"></svg:use>
@if (isVisuallySelected()) {
  <svg:rect
    class="drawing-item__selection"
    [attr.x]="bounds()?.x"
    [attr.y]="bounds()?.y"
    [attr.width]="bounds()?.width"
    [attr.height]="bounds()?.height"
  ></svg:rect>
}
@for (port of ports(); track port.id) {
  <svg:circle
    #drawingPort
    class="drawing-item__port te-port"
    [class.svg-hidden]="!arePortsVisible()"
    [class.is-process]="port.medium === 'process'"
    [class.is-electrical]="port.medium === 'electrical'"
    [attr.data-object-id]="itemId"
    [attr.data-port-id]="port.id"
    [attr.cx]="port.position.x"
    [attr.cy]="port.position.y"
    r="2"
  ></svg:circle>
}
